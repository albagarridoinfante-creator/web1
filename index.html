<!DOCTYPE html> <!-- Declara que el documento sigue el estándar HTML5 -->
<html lang="es"> <!-- Elemento raíz del documento y define el idioma español -->
<head> <!-- Cabecera con metadatos e información no visible en la página -->
  <meta charset="UTF-8"> <!-- Define la codificación UTF-8 para admitir tildes y caracteres especiales -->
  <title>Venta de Móviles</title> <!-- Título de la página que aparece en la pestaña del navegador -->
</head> <!-- Cierre de la cabecera de metadatos -->
<body> <!-- Contenedor del contenido visible de la página web -->
  <header><h1>Tienda de Móviles</h1></header> <!-- Encabezado principal con el título de la tienda -->
  <section> <!-- Sección principal que agrupa la oferta o catálogo de productos -->
    <article><h2>Smartphone Pro</h2><p>128 GB - 299€</p><button>Comprar</button></article> <!-- Ficha independiente de producto con nombre, detalles y botón -->
  </section> <!-- Cierre de la sección del catálogo -->
</body> <!-- Cierre del cuerpo visible de la página -->
</html> <!-- Cierre del documento HTML -->
